syntax = "proto3";

package upload;

option java_package = "upload.grpc";
option java_multiple_files = true;

// Producer streams one video to the consumer; consumer replies once at the end.
service VideoUpload {
  rpc Upload (stream UploadChunk) returns (UploadReply);
}

message UploadChunk {
  oneof data {
    string filename = 1;  // sent first
    bytes chunk = 2;      // file bytes, sent in pieces (e.g. 64 KB) to stay under gRPC's 4 MB message limit
  }
}

message UploadReply {
  bool accepted = 1;
  string message = 2;
}
